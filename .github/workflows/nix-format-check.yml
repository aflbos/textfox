name: Check Nix Distribution

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nix-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Check Nix formatting with nixfmt
        run: nix run nixpkgs#nixfmt-tree -- --ci
      - name: Parse the Nix flake and modules
        run: |
          nix-instantiate --parse flake.nix >/dev/null
          while IFS= read -r -d '' file; do
            nix-instantiate --parse "$file" >/dev/null
          done < <(find nix -name '*.nix' -print0)
      - name: Test Firefox AutoConfig profile safety
        run: node --test tests/nix-profile.test.mjs
      - name: Test the Nix CSS bundle
        run: bash tests/nix-bundle.sh
      - name: Build Home Manager profiles with custom paths and styles
        run: nix build --impure --no-link --print-build-logs --file tests/home-manager.nix
      - name: Evaluate the flake and build the wrapped Firefox
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Build the stylesheet package
        run: nix build --no-link --no-update-lock-file --print-build-logs .#default
